<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>katahub · telemetry</title>
<style>
  :root {
    --bg: #0a0b0e;
    --bg-elev: #14161c;
    --bg-card: #1a1d26;
    --border: #262a35;
    --text: #e8eaef;
    --text-muted: #8b92a5;
    --accent: #22d3ee;
    --accent-dim: #0e7490;
    --red: #ef4444;
    --green: #22c55e;
    --orange: #f59e0b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: linear-gradient(180deg, #0a0b0e 0%, #0f1116 100%);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
  }
  .nav {
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(10,11,14,0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #22d3ee 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .live-indicator {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
    70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 32px; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.2s ease;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(34,211,238,0.08);
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0; transition: opacity 0.2s;
  }
  .card:hover::before { opacity: 1; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-track { font-size: 18px; font-weight: 600; }
  .card-kart {
    background: linear-gradient(135deg, var(--accent-dim), transparent);
    padding: 4px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
    border: 1px solid rgba(34,211,238,0.2);
  }
  .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .stat { display: flex; flex-direction: column; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card-meta { color: var(--text-muted); font-size: 12px; margin-top: 14px; display: flex; justify-content: space-between; }
  .pill-status {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
  }
  .pill-status.uploaded { background: rgba(34,197,94,0.15); color: #4ade80; }
  .empty {
    text-align: center; padding: 80px 20px;
    color: var(--text-muted);
    background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">katahub <span class="brand-sub">· kart telemetry</span></span>
  <div class="live-indicator">
    <span class="live-dot"></span>
    <span>live · обновляется каждые 5с</span>
  </div>
</nav>
<div class="container">
  <h1>Сессии</h1>
  <p class="subtitle">Загруженные записи. Новые появляются автоматически.</p>
  <div id="grid" class="grid"></div>
</div>
<script>
async function load() {
  try {
    const r = await fetch('/sessions');
    const list = await r.json();
    const g = document.getElementById('grid');
    if (!list || list.length === 0) {
      g.outerHTML = '<div class="empty"><div class="empty-icon">⚡</div><div>Пока ни одной сессии.<br>Запиши заезд в iOS-приложении — он появится здесь автоматически.</div></div>';
      return;
    }
    g.innerHTML = list.map(s => {
      const dt = new Date(s.startedAt);
      const dur = s.durationSec ? Math.round(s.durationSec) + 's' : '—';
      return `
        <a class="card" href="/admin/session.html?id=${s.id}">
          <div class="card-head">
            <div>
              <div class="card-track">${s.track || 'Неизвестная трасса'}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${dt.toLocaleString('ru-RU')}</div>
            </div>
            ${s.kart ? `<span class="card-kart">карт ${s.kart}</span>` : ''}
          </div>
          <div class="card-stats">
            <div class="stat">
              <span class="stat-label">длительность</span>
              <span class="stat-value">${dur}</span>
            </div>
            <div class="stat">
              <span class="stat-label">статус</span>
              <span class="stat-value"><span class="pill-status uploaded">${s.status}</span></span>
            </div>
            <div class="stat">
              <span class="stat-label">id</span>
              <span class="stat-value" style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${s.id.slice(0,8)}</span>
            </div>
          </div>
        </a>
      `;
    }).join('');
  } catch (e) {
    console.error(e);
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
