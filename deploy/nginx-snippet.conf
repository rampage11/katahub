# =============================================================================
#  katahub backend — nginx server blocks
# -----------------------------------------------------------------------------
#  Append to /opt/kart-technic/nginx/nginx.conf on the VPS, then reload:
#    docker exec kart-technic-nginx-1 nginx -t
#    docker exec kart-technic-nginx-1 nginx -s reload
#
#  Replace kart.katahub.ru with the real domain before applying.
#  The HTTPS block will fail until the Let's Encrypt cert exists — see README.
#
#  Upstream: api container joins `kart-technic_default` network under DNS
#  name `katahub-api` (see docker-compose.prod.yml).
# =============================================================================

server {
    listen 80;
    server_name kart.katahub.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/katahub;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kart.katahub.ru;

    ssl_certificate     /etc/letsencrypt/live/kart.katahub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kart.katahub.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Session uploads can be large (iPhone+Watch zip ~50 MB per stint).
    client_max_body_size 500M;

    # SSE and WS need no buffering + long timeouts.
    location ~ ^/live/ {
        proxy_pass http://katahub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://katahub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
